services:
  namenode:
    image: apache/hadoop:withjava
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - namenode-data:/tmp/hadoop-root/dfs/name
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

  datanode:
    image: apache/hadoop:withjava
    command: ["hdfs", "datanode"]
    volumes:
      - datanode-data:/tmp/hadoop-root/dfs/data
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

volumes:
  namenode-data:
  datanode-data: